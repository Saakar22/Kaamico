<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're offline · Kaamico</title>
    <style>
      /* Self-contained: shown by the service worker when there is no connection. */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --ink: #1b1f24;
        --muted: #4b5563;
        --brand: #0b6e4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121417;
          --ink: #eceef1;
          --muted: #a7afba;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-top: 8px;
        padding: 0 20px;
        border-radius: 10px;
        background: var(--brand);
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
        <path
          d="M16 2C9.4 2 4 7.2 4 13.6 4 22.2 16 30 16 30s12-7.8 12-16.4C28 7.2 22.6 2 16 2Z"
          fill="#0b6e4f"
        />
        <path
          d="M12 7.5v13M12 14.6 18.4 8.4M12.6 14 15.6 17.8 21 11.6"
          fill="none"
          stroke="#fff"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <h1>You're offline</h1>
      <p>
        Kaamico needs an internet connection to show prices, bookings and messages. Check your
        connection and try again.
      </p>
      <!-- An empty href reloads the page that was asked for. -->
      <a href="">Try again</a>
    </main>
  </body>
</html>
