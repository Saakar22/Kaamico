name: Release

# Manual only. For the chosen GitHub environment (staging or production, each with its
# own secrets and, for production, required reviewers): apply database migrations, then
# build the image against that database and push it to GitHub Container Registry.
# The host then runs ghcr.io/<owner>/kaamico:<commit>. See docs/runbook.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kaamico
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      # Migrations are forward-only and applied before the new code starts, so they must
      # keep working with the previous release (add columns, never rename in one step).
      - name: Apply migrations
        run: node scripts/db-migrate.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker build --secret id=database_url,env=DATABASE_URL \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }} \
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ inputs.environment }} \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:${{ inputs.environment }}" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ inputs.environment }}"
      - name: Summary
        run: |
          echo "Image: $IMAGE:${{ github.sha }} (also tagged ${{ inputs.environment }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Next: point the host at this image, then run the smoke checks (docs/runbook.md)." >> "$GITHUB_STEP_SUMMARY"
