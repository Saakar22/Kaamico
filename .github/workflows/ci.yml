name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
  DATABASE_URL: postgres://kaamico:kaamico@localhost:5432/kaamico_dev
  DATABASE_URL_TEST: postgres://kaamico:kaamico@localhost:5432/kaamico_test
  # E2E runs `next start` (NODE_ENV=production) with simulated OTP/payments.
  ALLOW_SIMULATION_IN_PRODUCTION: 'true'
  CRON_SECRET: ci-only-cron-secret-not-used-in-production

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:create
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
